# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are secrets: Render asks for them when the
# Blueprint is created, and they are never stored in this file.
services:
  - type: web
    name: relay-api
    runtime: node
    plan: free # sleeps after 15 min idle; the first request then takes ~1 min
    region: frankfurt
    branch: main
    autoDeploy: true # redeploys on every push to main
    # NODE_ENV=production skips devDependencies, but the build needs tsup.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # MongoDB Atlas connection string, with the database name in the path,
      # e.g. mongodb+srv://user:pass@cluster.xxxx.mongodb.net/relay?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true # random 256-bit secret made by Render

      # The web app on Vercel. It proxies /api, so the refresh cookie is
      # first-party and SameSite=lax works.
      - key: CLIENT_ORIGINS
        value: https://relay-chat-olive.vercel.app
      - key: APP_URL
        value: https://relay-chat-olive.vercel.app
      - key: COOKIE_SAMESITE
        value: lax
      # Browser → Vercel proxy → Render load balancer → app: 2 proxies, so
      # req.ip is the visitor's IP (used by the rate limits).
      - key: TRUST_PROXY
        value: "2"

      # Email (required in production). Render's free plan blocks SMTP ports
      # 25, 465 and 587, so use Brevo's SMTP relay on port 2525 (STARTTLS).
      # SMTP_USER = the SMTP login from Brevo (…@smtp-brevo.com), SMTP_PASS =
      # a Brevo SMTP key, EMAIL_FROM = a sender verified in Brevo,
      # e.g. "Relay <you@gmail.com>".
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
